      <!-- Content Header (Page header) -->
      <div class="content-header">
        <div class="container-fluid">
          <div class="row mb-2">
            <div class="col-sm-6">
              <h1 class="m-0">Gestión de Usuarios</h1>
            </div><!-- /.col -->
          </div><!-- /.row -->
        </div><!-- /.container-fluid -->
      </div>
      <!-- /.content-header -->
  
      <!-- Main content -->
      <div class="content">
        <div class="container-fluid">
            <div class="row">
                <div class="col-12">
                  <div class="card">
                    <div class="card-header d-flex w-100 align-items-center">
                      <h3 class="card-title my-auto">Lista de Usuarios</h3>

                      <div class="input-group input-group-sm mx-auto" style="width: 600px;">
                        <input 
                          type="text" 
                          name="table_search" 
                          class="form-control" 
                          placeholder="Buscar usuario..."
                          [(ngModel)]="searchTerm">
                        <div class="input-group-append">
                          <button type="submit" class="btn btn-default">
                            <i class="fas fa-search"></i>
                          </button>
                        </div>
                      </div>

                      <div class="form-check form-switch ml-auto">
                        <input
                          class="form-check-input"
                          type="checkbox"
                          role="switch"
                          id="toggleIsActivate"
                          [(ngModel)]="showActiveProducts"
                          (change)="onToggleChange()">
                        <label class="form-check-label" for="toggleIsActivate">
                          Mostrar activos
                        </label>
                      </div>


                      <div class="ml-auto">
                          <button class="btn btn-success" (click)="openCreateModal()" data-toggle="modal" data-target="#userForm">
                              <i class="fas fa-plus-circle"></i> Agregar Usuario
                          </button> 
                      </div>
          
                    </div>
                    <!-- /.card-header -->
                    <div class="card-body table-responsive p-0" style="height: 600px;">
                      <table class="table table-head-fixed text-nowrap">
                        <thead>
                          <tr>
                            <th>Usuario</th>
                            <th>Activo</th>
                            <th>Bloqueado</th>
                            <th>Permisos</th>
                            <th></th>
                          </tr>
                        </thead>
                        <tbody>
                          <tr *ngFor="let user of users | filterBy:searchTerm:['username']">
                            <td>{{ user.username }}</td>
                            <td>{{ user.isActivate ?? false | booleanToText }}</td>
                            <td>{{ user.isBlocked | booleanToText }}</td>
                            <td>{{ user.roles | roleName}}</td>
                            <td>
                              <button 
                              class="btn btn-warning btn-sm mr-2" 
                              data-bs-toggle="tooltip"
                              data-placement="top"
                              title="Editar">
                                  <i class="fas fa-edit"></i>
                            </button>
                              <button 
                                class="btn btn-danger btn-sm mr-2" 
                                data-bs-toggle="tooltip"
                                data-placement="top"
                                title="Eliminar">
                                <i class="fas fa-trash"></i>
                              </button>
                            </td>
                          </tr>
                        </tbody>
                      </table>
                    </div>
                    <!-- /.card-body -->
                  </div>
                  <!-- /.card -->
                </div>
              </div> 
        </div>
        <!-- /.container-fluid-->
      </div>
      <!-- /.content -->
