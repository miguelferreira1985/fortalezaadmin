      <!-- Content Header (Page header) -->
      <div class="content-header">
        <div class="container-fluid">
          <div class="row mb-2">
            <div class="col-sm-6">
              <h1 class="m-0">Gestión de Categorias</h1>
            </div><!-- /.col -->
          </div><!-- /.row -->
        </div><!-- /.container-fluid -->
      </div>
      <!-- /.content-header -->
  
      <!-- Main content -->
      <div class="content">
        <div class="container-fluid">
            <div class="row">
                <div class="col-12">
                  <div class="card">
                    <div class="card-header d-flex w-100 align-items-center">
                      <h3 class="card-title my-auto">Lista de Categorias</h3>

                      <div class="input-group input-group-sm mx-auto" style="width: 600px;">
                        <input 
                          type="text" 
                          name="table_search" 
                          class="form-control" 
                          placeholder="Buscar categoría..."
                          [(ngModel)]="searchTerm">
                        <div class="input-group-append">
                          <button type="submit" class="btn btn-default">
                            <i class="fas fa-search"></i>
                          </button>
                        </div>
                      </div>


                      <div class="ml-auto">
                          <button class="btn btn-success" (click)="openCreateModal()" data-toggle="modal" data-target="#categoryForm">
                              <i class="fas fa-plus-circle"></i> Agregar Categoría
                          </button> 
                      </div>
          
                    </div>
                    <!-- /.card-header -->
                    <div class="card-body table-responsive p-0" style="height: 600px;">
                      <table class="table table-head-fixed text-nowrap">
                        <thead>
                          <tr>
                            <th>Nombre</th>
                            <th>Descripción</th>
                            <th></th>
                          </tr>
                        </thead>
                        <tbody>
                          <tr *ngFor="let category of categories | filterBy:searchTerm:['name']">
                            <td>{{ category.name }}</td>
                            <td>{{ category.description }}</td>
                            <td>
                              <button 
                              class="btn btn-warning btn-sm mr-2" 
                              (click)="openEditModal(category)"
                              data-bs-toggle="tooltip"
                              data-placement="top"
                              title="Editar">
                                  <i class="fas fa-edit"></i>
                            </button>
                              <button 
                                class="btn btn-danger btn-sm mr-2" 
                                data-bs-toggle="tooltip"
                                data-placement="top"
                                title="Eliminar">
                                <i class="fas fa-trash"></i>
                              </button>
                            </td>
                          </tr>
                        </tbody>
                      </table>
                    </div>
                    <!-- /.card-body -->
                  </div>
                  <!-- /.card -->
                </div>
              </div> 

              <!-- Form Modal -->
              <div class="modal fade" id="categoryModal" tabindex="-1" role="dialog" aria-labelledby="categoryModalLabel" aria-hidden="true">
                <div class="modal-dialog modal-sm" role="document">
                  <div class="modal-content">
                    <div class="modal-header">
                      <h5 class="modal-title" id="ategoryModalLabel">
                        {{ selectedCategory ? 'Editar Categoría' : 'Agregar Categoría' }}
                      </h5>
                      <button type="button" class="close" (click)="closeCategoryForm()">
                        <span aria-hidden="true">&times;</span>
                      </button>
                    </div>
                    <div class="modal-body">
                      <app-category-form 
                        #categoryFormModal
                        [category]="selectedCategory" 
                        (saveCategory)="onCategorySaved($event)">
                      </app-category-form>
                    </div>
                  </div>
                </div>
              </div>
              <!-- Form Modal -->
        </div>
        <!-- /.container-fluid-->
      </div>
      <!-- /.content -->
