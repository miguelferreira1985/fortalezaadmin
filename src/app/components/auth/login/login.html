<section class="login-section d-flex align-items-center justify-content-center vh-100 bg-light">

  <div class="container py-5">
    <div class="row d-flex align-items-center justify-content-center">

      <!-- Imagen -->
      <div class="col-md-6 col-lg-5 text-center mb-4 mb-lg-0">
        <img
          src="assets/images/FortalezaLogo.png"
          class="img-fluid login-image"
          alt="La Fortaleza Logo"
        />
      </div>

      <!-- Formulario -->
      <div class="col-md-6 col-lg-5">
        @if (errorMessage) {
          <div class="alert alert-danger">{{ errorMessage }}</div>
        }

        <form (ngSubmit)="onSubmit(loginForm)" #loginForm="ngForm" class="p-4 rounded shadow-sm bg-white">

          <h4 class="text-center mb-4 fw-bold text-primary">Iniciar sesión</h4>

          <div class="form-outline mb-3">
            <label class="form-label" for="username">Usuario</label>
            <input
              type="text"
              id="username"
              name="username"
              class="form-control form-control-lg"
              [(ngModel)]="username"
              required
            />
          </div>

          <div class="form-outline mb-3">
            <label class="form-label" for="password">Contraseña</label>
            <input
              type="password"
              id="password"
              name="password"
              class="form-control form-control-lg"
              [(ngModel)]="password"
              required
            />
          </div>

          <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="form-check">
              <input
                class="form-check-input"
                type="checkbox"
                id="rememberMe"
                checked
              />
              <label class="form-check-label" for="rememberMe">
                Recordarme
              </label>
            </div>
          </div>

          <button
            type="submit"
            class="btn btn-primary btn-lg w-100 shadow-sm"
          >
            Ingresar
          </button>
        </form>
      </div>
    </div>
  </div>
</section>
