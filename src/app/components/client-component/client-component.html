      <!-- Content Header (Page header) -->
      <div class="content-header">
        <div class="container-fluid">
          <div class="row mb-2">
            <div class="col-sm-6">
              <h1 class="m-0">Gestión de Clientes</h1>
            </div><!-- /.col -->
          </div><!-- /.row -->
        </div><!-- /.container-fluid -->
      </div>
      <!-- /.content-header -->
  
      <!-- Main content -->
      <div class="content">
        <div class="container-fluid">
            <div class="row">
                <div class="col-12">
                  <div class="card">
                    <div class="card-header d-flex w-100 align-items-center">
                      <h3 class="card-title my-auto">Lista de Clientes</h3>

                      <div class="input-group input-group-sm mx-auto" style="width: 600px;">
                        <input 
                          type="text" 
                          name="table_search" 
                          class="form-control" 
                          placeholder="Buscar cliente..."
                          [(ngModel)]="searchTerm">
                        <div class="input-group-append">
                          <button type="submit" class="btn btn-default">
                            <i class="fas fa-search"></i>
                          </button>
                        </div>
                      </div>

                      <div class="ml-auto">
                          <button class="btn btn-success" (click)="openCreateModal()" data-toggle="modal" data-target="#clientForm">
                              <i class="fa-solid fa-person-circle-plus"></i> Agregar Cliente
                          </button> 
                      </div>
          
                    </div>
                    <!-- /.card-header -->
                    <div class="card-body table-responsive p-0" style="height: 600px;">
                      <table class="table table-head-fixed text-nowrap">
                        <thead>
                          <tr>
                            <th>Nombre</th>
                            <th>Telefono</th>
                            <th>RFC</th>
                            <th></th>
                          </tr>
                        </thead>
                        <tbody>
                          <tr *ngFor="let client of clients | filterBy:searchTerm:['name','rfc']">
                            <td>{{ client.name }}</td>
                            <td>{{ client.phone }}</td>
                            <td>{{ client.rfc | uppercase }}</td>
                            <td>
                              <button 
                                class="btn btn-warning btn-sm mr-2" 
                                (click)="openEditModal(client)"
                                data-bs-toggle="tooltip"
                                data-placement="top"
                                title="Editar">
                                    <i class="fa-solid fa-file-pen"></i>
                              </button>
                              <button 
                              class="btn btn-danger btn-sm mr-2" 
                              data-bs-toggle="tooltip"
                              data-placement="top"
                              title="Desactivar">
                                  <i class="fa-solid fa-ban"></i>
                            </button>
                            </td>
                          </tr>
                        </tbody>
                      </table>
                    </div>
                    <!-- /.card-body -->
                  </div>
                  <!-- /.card -->
                </div>
              </div> 
              <div class="modal fade" id="clientModal" tabindex="-1" role="dialog" aria-labelledby="clientModalLabel" aria-hidden="true">
                <div class="modal-dialog modal-sm" role="document">
                  <div class="modal-content">
                    <div class="modal-header">
                      <h5 class="modal-title" id="clientModalLabel">
                        {{ selectedClient ? 'Editar Cliente' : 'Agregar Cliente' }}
                      </h5>
                      <button type="button" class="close" (click)="closeClientForm()">
                        <span aria-hidden="true">&times;</span>
                      </button>
                    </div>
                    <div class="modal-body">
                      <app-client-form-component
                        #clientFormModal
                        [client]="selectedClient" 
                        (saveClient)="onClientSaved($event)">
                      </app-client-form-component>
                    </div>
                  </div>
                </div>
              </div>
        </div>
        <!-- /.container-fluid-->
      </div>
      <!-- /.content -->
