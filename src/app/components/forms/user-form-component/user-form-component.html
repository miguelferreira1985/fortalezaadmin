<form [formGroup]="form" (ngSubmit)="onSubmit()">

    <div class="form-group">
        <label>Empleados*</label>
        <ng-select
          [items]="employees"
          [multiple]="false"
          bindLabel="fullName"
          bindValue="id"
          dropdownPosition="bottom"
          formControlName="employeeId"
          placeholder="Seleccione un empleado">
        </ng-select>
        <small class="text-danger"
          *ngIf="c('employeeId').touched && c('employeeId').hasError('required')">
          Debe seleccionar un empleado.
        </small>
    </div>

    @if (c('employeeId').value ) {

        <div class="form-group">
            <label for="username">Nombre de Usuario*</label>
            <input 
              type="text" 
              class="form-control"
              id="username" 
              name="username"
              formControlName="username"
              autocomplete="off" />
        </div>
        <small class="text-danger" *ngIf="c('username').touched && c('username').hasError('required')">
          El nombre de usuario es obligatorio.
        </small>

        <div class="row">
            <div class="col-md-6">
                <div class="form-group">
                    <label for="password">Contraseña*</label>
                    <input 
                        [type]="showNewPassword ? 'text' : 'password'" 
                        class="form-control" 
                        id="password" 
                        name="password" 
                        formControlName="password"
                        autocomplete="new-password"
                        autocorrect="off"
                        autocapitalize="off"
                        spellcheck="false">
        
                    <button type="button"
                            class="btn btn-link position-absolute"
                            style="top: 32px; right: 10px;"
                            (click)="togglePasswordVisibility('new')">
                            <i class="fa" [ngClass]="showNewPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
                    </button>
                </div> 
                    <small class="text-danger" *ngIf="c('password')?.touched && (c('password')?.hasError('required') || c('password')?.hasError('minlength'))">
                        El constraseña es obligatoria (mín. 8 caracteres)
                    </small>
            </div>
        
            <div class="col-md-6">
                <div class="form-group">
                    <label for="confirmPassword">Confirmar Contraseña*</label>
                    <input 
                        [type]="showConfirmPassword ? 'text' : 'password'" 
                        class="form-control" 
                        id="confirmPassword" 
                        name="confirmPassword" 
                        formControlName="confirmPassword"
                        autocomplete="new-password"
                        autocorrect="off"
                        autocapitalize="off"
                        spellcheck="false">
        
                    <button type="button"
                        class="btn btn-link position-absolute"
                        style="top: 32px; right: 10px;"
                        (click)="togglePasswordVisibility('confirm')">
                        <i class="fa" [ngClass]="showConfirmPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
                    </button>
                </div>

                <small class="text-danger"
                  *ngIf="c('confirmPassword')?.touched && c('confirmPassword')?.hasError('required')">
                  La contraseña es obligatoria.
                </small>

                <small class="text-danger"
                  *ngIf="form.touched && (form.hasError('passwordMismatch') || c('confirmPassword')?.hasError('passwordMismatch'))">
                  Las contraseñas no coinciden.
                </small>
            </div>
        </div>

        <div class="form-group">
            <label>Permisos*</label>
            <ng-select
              [items]="roles"
              [multiple]="true"
              bindLabel="name"
              bindValue="id"
              dropdownPosition="bottom"
              formControlName="roles"
              placeholder="Seleccione uno o más permisos">
            </ng-select>
            <small class="text-danger"
              *ngIf="c('roles').touched && c('roles').hasError('required')">
              Selecciona al menos un permiso.
            </small>
        </div>
    }
    
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" (click)="closeUserForm()">Cancelar</button>
      <button type="submit" class="btn btn-primary" [disabled]="form.invalid">Guardar</button>
    </div>
  </form>
