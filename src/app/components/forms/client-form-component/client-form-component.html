<form [formGroup]="form" (ngSubmit)="onSubmit()">

    <div class="form-group">
        <label for="name">Nombre*</label>
        <input class="form-control" id="name" name="name" formControlName="name">
        <small class="text-danger" *ngIf="c('name').touched && c('name').invalid">El nombre es obligatorio.</small>
    </div>

    <div class="form-group">
        <label for="rfc">RFC*</label>
        <input class="form-control" id="rfc" name="rfc" formControlName="rfc">
        <small class="text-danger" *ngIf="c('rfc').touched && c('rfc').invalid">El RFC es obligatorio.</small>
    </div>

    <div class="form-group">
        <label for="phone">Teléfono</label>
        <input type="text" class="form-control" id="phone" name="phone" formControlName="phone">
    </div>
    
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" (click)="closeClientForm()">Cancelar</button>
      <button type="submit" class="btn btn-primary" [disabled]="form.invalid">Guardar</button>
    </div>
  </form>
