<form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="row">
        <div class="col-md-6">
          <div class="form-group">
            <label for="name">Nombre*</label>
            <input type="text" class="form-control" id="name" name="name" formControlName="name">
            <small class="text-danger" *ngIf="c('name').touched && c('name').invalid">El nombre es obligatorio.</small>
        </div>
        </div>
        <div class="col-md-6">
          <label>Categoría</label>
          <ng-select
            [items]="catgories"
            [multiple]="false"
            bindLabel="name"
            bindValue="id"
            appendTo="body"
            dropdownPosition="bottom"
            formControlName="categoryId"
            placeholder="Seleccione una categoría">
          </ng-select>
        </div>
    </div>

    <div class="form-group">
      <label for="description">Descripción</label>
      <textarea class="form-control" id="description" name="description" formControlName="description"></textarea>
    </div>
    
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" (click)="closeSubcategoryForm()">Cancelar</button>
      <button type="submit" class="btn btn-primary" [disabled]="form.invalid">Guardar</button>
    </div>
  </form>
