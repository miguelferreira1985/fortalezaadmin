<form [formGroup]="form" (ngSubmit)="onSubmit()">

    <div class="row">

        <div class="col-md-6">
            <div class="form-group">
                <label for="newPassword">Nueva Contraseña*</label>
                <input 
                    [type]="showNewPassword ? 'text' : 'password'" 
                    class="form-control" 
                    id="newPassword" 
                    name="newPassword" 
                    formControlName="newPassword"
                    autocomplete="new-password"
                    autocorrect="off"
                    autocapitalize="off"
                    spellcheck="false">

                    <button type="button"
                            class="btn btn-link position-absolute"
                            style="top: 32px; right: 10px;"
                            (click)="togglePasswordVisibility('new')">
                            <i class="fa" [ngClass]="showNewPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
                    </button>
                </div>

                <small class="text-danger" *ngIf="c('newPassword')?.touched && (c('newPassword')?.hasError('required') || c('newPassword')?.hasError('minlength'))">
                    El constraseña es obligatoria (mín. 8 caracteres)
                  </small>
        </div>

        <div class="col-md-6">
            <div class="form-group">
              <label for="confirmPassword">Confirmar Contraseña*</label>
              <input 
              [type]="showConfirmPassword ? 'text' : 'password'" 
                class="form-control" 
                id="confirmPassword" 
                name="confirmPassword" 
                formControlName="confirmPassword"
                autocomplete="new-password"
                autocorrect="off"
                autocapitalize="off"
                spellcheck="false">

                <button type="button"
                        class="btn btn-link position-absolute"
                        style="top: 32px; right: 10px;"
                        (click)="togglePasswordVisibility('confirm')">
                    <i class="fa" [ngClass]="showConfirmPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
                </button>
            </div>

            <small class="text-danger"
                *ngIf="c('confirmPassword')?.touched && c('confirmPassword')?.hasError('required')">
                La contraseña es obligatoria.
            </small>

            <small class="text-danger"
                *ngIf="form.touched && (form.hasError('passwordMismatch') || c('confirmPassword')?.hasError('passwordMismatch'))">
                Las contraseñas no coinciden.
            </small>
        </div>
    </div>
    
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" (click)="closeChangePasswordModal()">Cancelar</button>
      <button type="submit" class="btn btn-primary" [disabled]="form.invalid">Guardar</button>
    </div>
  </form>
