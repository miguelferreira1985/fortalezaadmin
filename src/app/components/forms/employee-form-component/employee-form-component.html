<form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="row">
        <div class="col-md-6">
            <div class="form-group">
                <label for="firstName">Nombre(s)*</label>
                <input type="text" class="form-control" id="firstName" name="firstName" formControlName="firstName">
                <small class="text-danger" *ngIf="c('firstName').touched && c('firstName').invalid">El nombre es obligatorio.</small>
            </div>
        </div>
        <div class="col-md-6">
            <div class="form-group">
                <label for="lastName">Apellidos*</label>
                <input type="text" class="form-control" id="lastName" name="lastName" formControlName="lastName">
                <small class="text-danger" *ngIf="c('lastName').touched && c('lastName').invalid">El apellido es obligatorio.</small>
              </div>
        </div>
    </div>

    <div class="form-group">
      <label for="address">Dirección</label>
      <textarea class="form-control" id="address" name="address" formControlName="address"></textarea>
    </div>

    <div class="row">

      <div class="col-md-4">
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email"
            class="form-control"
            id="email"
            name="email"
            formControlName="email"/>          
          </div>
      </div>

      <div class="col-md-4">
        <div class="form-group">
            <label for="phone">Teléfono*</label>
            <input type="tel" class="form-control" id="phone" name="phone" formControlName="phone" />
            <small class="text-danger" *ngIf="c('phone').touched && c('phone').invalid">El telefono es obligatorio.</small>
          </div>
      </div>

      <div class="col-md-4">
        <div class="form-group">
            <label for="ssn">NSS</label>
            <input type="text"
            class="form-control"
            id="ssn"
            name="ssn"
            formControlName="ssn"/>
          </div>
      </div>

    </div>

    @if (!form.get('id')?.value) {

        <div class="form-group form-check" >
            <input 
              type="checkbox" 
              class="form-check-input" 
              id="createUser" 
              formControlName="createUser"  />
            <label class="form-check-label" for="createUser">
              Crear usuario del sistema
            </label>
          </div>

          @if (form.get('createUser')?.value) {

            <div class="row">
                <div class="col-md-4">
                    <div class="form-group">
                        <label for="username">Nombre de Usuario*</label>
                        <input 
                          type="text" 
                          class="form-control"
                          id="username" 
                          name="username"
                          formControlName="username" />
                    </div>
                    <small class="text-danger" *ngIf="c('username').touched && c('username').hasError('required')">
                      El nombre de usuario es obligatorio.
                    </small>
                </div>
                <div class="col-md-4">
                    <div class="form-group">
                        <label for="password">Contraseña*</label>
                        <input 
                          type="password" 
                          class="form-control" 
                          id="password" 
                          name="password" 
                          formControlName="password"
                          autocomplete="new-password"
                          autocorrect="off"
                          autocapitalize="off"
                          spellcheck="false" />
                      </div>
                      <small class="text-danger" *ngIf="c('password').touched && (c('password').hasError('required') || c('password').hasError('minlength'))">
                        La constraseña es obligatoria (mín. 8 caracteres)
                      </small>

                </div>
        
                <div class="col-md-4">
                    <label>Permisos*</label>
                    <ng-select
                      [items]="roles"
                      [multiple]="true"
                      bindLabel="name"
                      bindValue="id"
                      dropdownPosition="bottom"
                      formControlName="roles"
                      placeholder="Seleccione uno o más permisos">
                    </ng-select>
                    <small class="text-danger"
                      *ngIf="c('roles').touched && c('roles').hasError('required')">
                      Selecciona al menos un permiso.
                    </small>
                </div>
            </div>

          }

    }
    
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" (click)="closeEmployeeForm()">Cancelar</button>
      <button type="submit" class="btn btn-primary" [disabled]="form.invalid">Guardar</button>
    </div>
  </form>
