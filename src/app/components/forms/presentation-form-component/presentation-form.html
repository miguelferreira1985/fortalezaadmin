<form (ngSubmit)="onSubmit()" #presentationForm="ngForm">
    <div class="form-group">
        <label for="name">Nombre</label>
        <input class="form-control" id="name" name="name" [(ngModel)]="formPresentation.name">
      </div>

    <div class="form-group">
      <label for="abbreviation">Abreviación</label>
      <input class="form-control" id="abbreviation" name="abbreviation" [(ngModel)]="formPresentation.abbreviation">
    </div>
    
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" (click)="closePresentationForm()">Cancelar</button>
      <button type="submit" class="btn btn-primary" [disabled]="!presentationForm.valid">Guardar</button>
    </div>
  </form>
